{% extends "base.html" %}
{% block titulo %}Categoría{% endblock %}
{% block contenido %}
<h1>{{ 'Editar' if categoria else 'Nueva' }} categoría</h1>
<form method="post" class="col-md-5">
  <div class="mb-3"><label class="form-label">Nombre</label>
    <input name="nombre" class="form-control" value="{{ categoria.nombre if categoria else '' }}" required></div>
  <button class="btn btn-sigr">Guardar</button>
  <a href="/menu/categorias" class="ms-2">Cancelar</a>
</form>
{% endblock %}
