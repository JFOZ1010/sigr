{% extends "base.html" %}
{% block titulo %}Categorías{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Categorías</h1>
  <a href="/menu/categorias/nueva" class="btn btn-sigr">+ Nueva categoría</a>
</div>
<table class="table align-middle">
  {% for c in categorias %}
  <tr>
    <td>{{ c.nombre }} <span class="text-muted">({{ c.platos|length }} platos)</span></td>
    <td class="text-end">
      <a href="/menu/categorias/{{ c.id }}/editar" class="btn btn-sm btn-outline-secondary">Editar</a>
      <form method="post" action="/menu/categorias/{{ c.id }}/eliminar" class="d-inline"
            onsubmit="return confirm('¿Eliminar esta categoría?')">
        <button class="btn btn-sm btn-outline-danger">Eliminar</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td class="text-muted">Sin categorías.</td></tr>
  {% endfor %}
</table>
{% endblock %}
