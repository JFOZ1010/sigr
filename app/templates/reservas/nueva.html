{% extends "base.html" %}
{% block titulo %}Nueva reserva{% endblock %}
{% block contenido %}
<h1>Nueva reserva</h1>
<form method="post" class="col-md-5">
  <div class="mb-3"><label class="form-label">Fecha</label>
    <input type="date" name="fecha" min="{{ hoy.isoformat() }}" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Hora</label>
    <input type="time" name="hora" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Personas</label>
    <input type="number" name="personas" min="1" value="2" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Mesa</label>
    <select name="mesa" class="form-select">
      {% for m in mesas %}<option value="{{ m }}">Mesa {{ m }}</option>{% endfor %}
    </select></div>
  <button class="btn btn-sigr">Reservar</button>
  <a href="/reservas/" class="ms-2">Cancelar</a>
</form>
{% endblock %}
