{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3">Iniciar sesión</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label">Correo</label>
      <input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Contraseña</label>
      <input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-sigr">Ingresar</button>
    <a href="/auth/registro" class="ms-2">Crear cuenta</a>
  </form>
</div></div>
{% endblock %}
