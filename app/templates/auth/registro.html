{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3">Crear cuenta de cliente</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label">Nombre</label>
      <input name="nombre" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Correo</label>
      <input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Contraseña (mín. 6 caracteres)</label>
      <input type="password" name="password" class="form-control" required minlength="6"></div>
    <button class="btn btn-sigr">Registrarme</button>
  </form>
</div></div>
{% endblock %}
